<svg viewBox="0 0 900 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#0d2247"/>
    </linearGradient>
  </defs>
  <rect width="900" height="200" fill="url(#bg)" rx="12"/>

  <!-- grid lines -->
  <line x1="0" y1="40" x2="900" y2="40" stroke="#1d2733" stroke-width="1"/>
  <line x1="0" y1="80" x2="900" y2="80" stroke="#1d2733" stroke-width="1"/>
  <line x1="0" y1="120" x2="900" y2="120" stroke="#1d2733" stroke-width="1"/>
  <line x1="0" y1="160" x2="900" y2="160" stroke="#1d2733" stroke-width="1"/>
  <line x1="150" y1="0" x2="150" y2="200" stroke="#1d2733" stroke-width="1"/>
  <line x1="300" y1="0" x2="300" y2="200" stroke="#1d2733" stroke-width="1"/>
  <line x1="450" y1="0" x2="450" y2="200" stroke="#1d2733" stroke-width="1"/>
  <line x1="600" y1="0" x2="600" y2="200" stroke="#1d2733" stroke-width="1"/>
  <line x1="750" y1="0" x2="750" y2="200" stroke="#1d2733" stroke-width="1"/>

  <!-- accent line left -->
  <rect x="0" y="0" width="4" height="200" fill="#3fb950" rx="2"/>

  <!-- terminal prompt -->
  <text x="28" y="72" font-family="'Courier New',monospace" font-size="13" fill="#3fb950">~/sumit $</text>
  <text x="105" y="72" font-family="'Courier New',monospace" font-size="13" fill="#58a6ff">whoami</text>

  <!-- name -->
  <text x="28" y="115" font-family="Georgia,serif" font-size="42" font-weight="700" fill="#e6edf3" letter-spacing="-1">Sumit Singh</text>

  <!-- subtitle -->
  <text x="30" y="142" font-family="'Courier New',monospace" font-size="14" fill="#8b949e">Backend Developer</text>
  <text x="178" y="142" font-family="'Courier New',monospace" font-size="14" fill="#484f58"> · </text>
  <text x="192" y="142" font-family="'Courier New',monospace" font-size="14" fill="#79c0ff">Node.js</text>
  <text x="248" y="142" font-family="'Courier New',monospace" font-size="14" fill="#484f58"> · </text>
  <text x="262" y="142" font-family="'Courier New',monospace" font-size="14" fill="#e3b341">AWS</text>
  <text x="295" y="142" font-family="'Courier New',monospace" font-size="14" fill="#484f58"> · </text>
  <text x="309" y="142" font-family="'Courier New',monospace" font-size="14" fill="#bc8cff">DSA</text>

  <!-- badges right -->
  <rect x="620" y="58" width="170" height="26" rx="6" fill="#0a2e1a" stroke="#1a5c30" stroke-width="1"/>
  <text x="636" y="76" font-family="'Courier New',monospace" font-size="12" fill="#3fb950">▲ Open to Work</text>

  <rect x="620" y="94" width="170" height="26" rx="6" fill="#2e1f00" stroke="#6e4500" stroke-width="1"/>
  <text x="636" y="112" font-family="'Courier New',monospace" font-size="12" fill="#e3b341">☁ AWS Certified</text>

  <rect x="620" y="130" width="170" height="26" rx="6" fill="#0d2247" stroke="#1d4080" stroke-width="1"/>
  <text x="636" y="148" font-family="'Courier New',monospace" font-size="12" fill="#79c0ff">⚡ 600+ DSA Solved</text>

  <!-- cursor blink -->
  <rect x="350" y="128" width="2" height="18" fill="#3fb950" opacity="0.8">
    <animate attributeName="opacity" values="0.8;0;0.8" dur="1.2s" repeatCount="indefinite"/>
  </rect>

  <!-- bottom bar -->
  <line x1="0" y1="190" x2="900" y2="190" stroke="#30363d" stroke-width="1"/>
  <text x="28" y="185" font-family="'Courier New',monospace" font-size="10" fill="#484f58">Graphic Era University · MCA 2026 · Dehradun, India</text>
</svg>
